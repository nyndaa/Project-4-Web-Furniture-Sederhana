<section class="search-section">
  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Cari furniture impian Anda..."
    >

    <button id="searchBtn">
      <i class="fa-solid fa-magnifying-glass"></i>
      Cari
    </button>
  </div>
</section>

<!-- CATEGORY -->
<section class="category-section">
  <div class="category-list">

    <button class="category-btn active" data-filter="all">
      <i class="fa-solid fa-border-all"></i>
      Semua
    </button>

    <button class="category-btn" data-filter="sofa">
      <i class="fa-solid fa-couch"></i>
      Sofa
    </button>

    <button class="category-btn" data-filter="kursi">
      <i class="fa-solid fa-chair"></i>
      Kursi
    </button>

    <button class="category-btn" data-filter="meja">
      <i class="fa-solid fa-table"></i>
      Meja
    </button>

    <button class="category-btn" data-filter="lemari">
      <i class="fa-solid fa-box-open"></i>
      Lemari
    </button>

    <button class="category-btn" data-filter="rak">
      <i class="fa-solid fa-layer-group"></i>
      Rak
    </button>

    <button class="category-btn" data-filter="tempat-tidur">
      <i class="fa-solid fa-bed"></i>
      Tempat Tidur
    </button>

    <button class="category-btn" data-filter="lampu-tidur">
      <i class="fa-solid fa-lightbulb"></i>
      Lampu Tidur
    </button>

  </div>
</section>

<!-- PRODUK -->
<section class="catalog">
  <div class="catalog-grid">

    {{CATALOG_PRODUCTS}}

  </div>
</section>

<!-- SCRIPT -->
<script>
const buttons = document.querySelectorAll(".category-btn");
const cards = document.querySelectorAll(".catalog-card");

buttons.forEach(btn => {
  btn.addEventListener("click", () => {

    const filter = btn.getAttribute("data-filter");

    buttons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    cards.forEach(card => {

      const category = card.getAttribute("data-category");

      if (filter === "all" || filter === category) {
        card.style.display = "block";
      } else {
        card.style.display = "none";
      }

    });

  });
});

/* SEARCH */
const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");

searchBtn.addEventListener("click", () => {

  const keyword = searchInput.value.toLowerCase();

  cards.forEach(card => {

    const title = card
      .querySelector("h3")
      .textContent
      .toLowerCase();

    if (title.includes(keyword)) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }

  });

});
</script>
